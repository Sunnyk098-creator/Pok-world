<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival RPG Prototype - Optimized, Day/Night & Idle AI</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        
        body {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        #camera-viewport {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #4a752c;
            overflow: hidden;
            z-index: 1;
        }

        #game-world {
            position: absolute;
            top: 0; left: 0;
            width: 3000px;
            height: 3000px;
            transform-origin: 0 0;
            will-change: transform;
        }

        /* --- DAY / NIGHT OVERLAY --- */
        #night-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 40, 0.65);
            pointer-events: none;
            z-index: 15;
            opacity: 0;
            transition: opacity 2s ease;
        }
        #night-overlay.night-active {
            opacity: 1;
        }

        /* --- ENVIRONMENT --- */
        .grass {
            position: absolute;
            width: 20px; height: 5px;
            background: #5b9036;
            border-radius: 5px;
            z-index: 1;
        }

        .tree {
            position: absolute;
            width: 220px; height: 280px;
            transform: translate(-50%, -100%);
            z-index: 4;
            transition: transform 0.1s;
        }
        .tree canvas, .tree img { 
            width: 100%; height: 100%; 
            object-fit: contain; 
            object-position: bottom center; 
        }

        .stone {
            position: absolute;
            font-size: 110px;
            transform: translate(-50%, -50%);
            z-index: 3;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        /* --- CHARACTERS --- */
        .player-capsule {
            position: absolute;
            width: 60px; height: 80px; /* Made slightly bigger for actual character */
            z-index: 10;
            transform: translate(-50%, -50%);
            transition: filter 0.2s; /* Replaced border transition with filter for images */
            border-radius: 15px; /* Keeps fallback shape */
        }
        .player-capsule img {
            width: 100%; height: 100%;
            object-fit: contain;
            transition: transform 0.1s ease;
        }
        .player-capsule.dashing {
            filter: drop-shadow(0 0 10px #f1c40f);
        }

        .chikipi {
            position: absolute;
            width: 60px; height: 60px;
            transform: translate(-50%, -50%);
            z-index: 5;
        }
        .chikipi img {
            width: 100%; height: 100%;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        /* --- UI LAYER --- */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
        }
        .interactive { pointer-events: auto; cursor: pointer; }

        .btn-debug-time {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(231, 76, 60, 0.8);
            color: white;
            padding: 10px 15px;
            border: 2px solid white;
            border-radius: 8px;
            font-weight: bold;
            z-index: 25;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .btn-debug-time:active { background: rgba(231, 76, 60, 1); }

        #notification-area {
            position: absolute;
            top: 100px; left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .notify-msg {
            background: rgba(0, 0, 0, 0.7);
            color: #f1c40f;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            border: 1px solid #f1c40f;
            animation: slideInFadeOut 2.5s forwards;
            opacity: 0;
        }
        @keyframes slideInFadeOut {
            0% { opacity: 0; transform: translateX(-20px); }
            10% { opacity: 1; transform: translateX(0); }
            80% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        .health-bar-container {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            width: 250px; height: 25px;
            background: #333;
            border: 3px solid #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #health-fill {
            width: 100%; height: 100%;
            background: #2ecc71;
            transition: width 0.2s, background-color 0.3s;
        }

        .map-btn {
            position: absolute;
            top: 20px; left: 20px;
            width: 60px; height: 60px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #fff;
            border-radius: 50%;
            color: #fff;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold;
        }

        .joystick-base {
            position: absolute;
            bottom: 40px; left: 40px;
            width: 130px; height: 130px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
            backdrop-filter: blur(2px);
        }
        .joystick-knob {
            position: absolute;
            top: 50%; left: 50%;
            width: 55px; height: 55px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .action-cluster {
            position: absolute;
            bottom: 30px; right: 30px;
            width: 200px; height: 200px;
        }
        .action-btn {
            position: absolute;
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.7);
            border-radius: 50%;
            color: white;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px;
            backdrop-filter: blur(2px);
        }
        .action-btn:active { background: rgba(255,255,255,0.4); }
        .btn-shoot { bottom: 10px; right: 10px; width: 85px; height: 85px; }
        .btn-crawl { bottom: 110px; right: 30px; width: 65px; height: 65px; font-size: 20px; }
        .btn-sphere { bottom: 30px; right: 110px; width: 55px; height: 55px; }

    </style>
</head>
<body>

    <div id="camera-viewport">
        <div id="game-world">
            <div class="player-capsule" id="player">
                <img id="player-sprite" src="player-idle.gif" alt="Player" onerror="this.style.display='none'; this.parentElement.style.backgroundColor='#2ecc71'; this.parentElement.style.border='2px solid white';">
            </div>
        </div>
    </div>
    
    <div id="night-overlay"></div>

    <div id="ui-layer">
        <div class="health-bar-container">
            <div id="health-fill"></div>
        </div>
        <div class="map-btn interactive">MAP</div>
        <div class="btn-debug-time interactive" id="btn-time-toggle">Toggle Time</div>
        <div id="notification-area"></div>
        
        <div class="joystick-base interactive" id="joystick-base">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>
        <div class="action-cluster interactive">
            <div class="action-btn btn-sphere">🔮</div>
            <div class="action-btn btn-crawl" id="btn-crawl">💨</div>
            <div class="action-btn btn-shoot" id="btn-shoot">🥊</div> 
        </div>
    </div>

    <script>
        const WORLD_SIZE = 3000;
        const CHUNK_SIZE = 500; 
        let currentChunkX = -1;
        let currentChunkY = -1;
        
        const world = document.getElementById('game-world');
        const playerEl = document.getElementById('player');
        const playerSprite = document.getElementById('player-sprite'); // Player Image Target
        const healthFill = document.getElementById('health-fill');
        const notifArea = document.getElementById('notification-area');
        const joyBase = document.getElementById('joystick-base');
        const joyKnob = document.getElementById('joystick-knob');
        const nightOverlay = document.getElementById('night-overlay');

        let player = { x: 1500, y: 1500, health: 100, speed: 5, isDashing: false, facing: 1 };
        let joyVector = { x: 0, y: 0 };
        let isGameRunning = true;
        let playerAttackTimer = null; // Used to return to idle after attacking

        const CYCLE_TIME = 600000; 
        let isNight = false;
        let lastCycleChange = Date.now();

        let grasses = [];
        let trees = [];
        let stones = [];
        let chikipis = [];

        function generateWorld() {
            // Grass
            for(let i=0; i<400; i++) {
                let gx = Math.random() * WORLD_SIZE;
                let gy = Math.random() * WORLD_SIZE;
                let grass = document.createElement('div');
                grass.className = 'grass';
                grass.style.left = `${gx}px`;
                grass.style.top = `${gy}px`;
                world.appendChild(grass);
                grasses.push({ x: gx, y: gy, el: grass, isVisible: true });
            }
            
            // Trees
            for(let i=0; i<40; i++) {
                let tx = Math.random() * WORLD_SIZE;
                let ty = Math.random() * WORLD_SIZE;
                let treeEl = document.createElement('div');
                treeEl.className = 'tree';
                treeEl.style.left = `${tx}px`;
                treeEl.style.top = `${ty}px`;
                
                let img = new Image();
                img.src = 'tree.gif';
                img.onload = function() {
                    let canvas = document.createElement('canvas');
                    canvas.width = this.width || 220;
                    canvas.height = this.height || 280;
                    let ctx = canvas.getContext('2d');
                    ctx.drawImage(this, 0, 0, canvas.width, canvas.height);
                    treeEl.appendChild(canvas);
                };
                img.onerror = function() { 
                    treeEl.innerHTML = '🌲'; 
                    treeEl.style.fontSize = '200px'; 
                    treeEl.style.textAlign = 'center';
                };
                
                world.appendChild(treeEl);
                trees.push({ x: tx, y: ty, el: treeEl, hits: 0, woodGiven: 0, isVisible: true });
            }
            
            // Stones
            for(let i=0; i<20; i++) {
                let sx = Math.random() * WORLD_SIZE;
                let sy = Math.random() * WORLD_SIZE;
                let stoneEl = document.createElement('div');
                stoneEl.className = 'stone';
                stoneEl.innerHTML = '🪨';
                stoneEl.style.left = `${sx}px`;
                stoneEl.style.top = `${sy}px`;
                world.appendChild(stoneEl);
                stones.push({ x: sx, y: sy, el: stoneEl, isVisible: true });
            }
            
            // Chikipis
            for(let i=0; i<25; i++) {
                let cX = Math.random() * WORLD_SIZE;
                let cY = Math.random() * WORLD_SIZE;
                let cEl = document.createElement('div');
                cEl.className = 'chikipi';
                cEl.style.left = `${cX}px`;
                cEl.style.top = `${cY}px`;
                let img = document.createElement('img');
                img.src = 'chikipi-idle.gif';
                img.onerror = function() { this.style.display = 'none'; cEl.style.backgroundColor='yellow'; cEl.style.borderRadius='50%'; };
                cEl.appendChild(img);
                world.appendChild(cEl);
                
                chikipis.push({
                    x: cX, y: cY, el: cEl, img: img,
                    targetX: cX, targetY: cY,
                    health: 20, isAggro: false, isVisible: true,
                    speed: 1, state: 'idle', currentAnim: 'chikipi-idle.gif',
                    nextWanderTime: Date.now() + Math.random() * 2000, 
                    dashVx: 0, dashVy: 0, dashTimer: 0, 
                    nextDashTime: 0, nextMeleeAttack: 0, stunTimer: 0 
                });
            }
        }
        generateWorld();

        function showNotification(text) {
            let msg = document.createElement('div');
            msg.className = 'notify-msg';
            msg.innerText = text;
            notifArea.appendChild(msg);
            setTimeout(() => { msg.remove(); }, 2500);
        }

        function toggleTime(e) {
            if(e) e.preventDefault();
            isNight = !isNight;
            lastCycleChange = Date.now(); 
            if (isNight) {
                nightOverlay.classList.add('night-active');
                showNotification("Night has fallen...");
            } else {
                nightOverlay.classList.remove('night-active');
                showNotification("A new day begins...");
            }
        }
        document.getElementById('btn-time-toggle').addEventListener('click', toggleTime);
        document.getElementById('btn-time-toggle').addEventListener('touchstart', toggleTime);

        function setChikipiAnim(c, animName) {
            if (c.currentAnim !== animName) {
                c.currentAnim = animName;
                c.img.src = animName;
            }
        }

        // --- JOYSTICK LOGIC ---
        let activeTouchId = null;
        let joyActive = false;
        let joyCenterX, joyCenterY;
        const maxJoyRadius = 40;

        joyBase.addEventListener('touchstart', handleJoyStart, {passive: false});
        window.addEventListener('touchmove', handleJoyMove, {passive: false});
        window.addEventListener('touchend', handleJoyEnd);
        joyBase.addEventListener('mousedown', handleJoyStart);
        window.addEventListener('mousemove', handleJoyMove);
        window.addEventListener('mouseup', handleJoyEnd);

        function handleJoyStart(e) {
            e.preventDefault();
            joyActive = true;
            const rect = joyBase.getBoundingClientRect();
            joyCenterX = rect.left + rect.width / 2;
            joyCenterY = rect.top + rect.height / 2;
            if (e.changedTouches) {
                activeTouchId = e.changedTouches[0].identifier;
                updateKnobPositionWithCoords(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            } else {
                updateKnobPositionWithCoords(e.clientX, e.clientY);
            }
        }

        function handleJoyMove(e) {
            if (!joyActive) return;
            if (e.changedTouches) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        updateKnobPositionWithCoords(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                        break;
                    }
                }
            } else {
                updateKnobPositionWithCoords(e.clientX, e.clientY);
            }
        }

        function handleJoyEnd(e) {
            if (e.changedTouches) {
                let isJoystickTouchEnding = false;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        isJoystickTouchEnding = true;
                        break;
                    }
                }
                if (!isJoystickTouchEnding) return; 
            }
            joyActive = false;
            activeTouchId = null;
            joyKnob.style.transform = `translate(-50%, -50%)`;
            joyVector = { x: 0, y: 0 };
        }

        function updateKnobPositionWithCoords(clientX, clientY) {
            let dx = clientX - joyCenterX;
            let dy = clientY - joyCenterY;
            let distance = Math.sqrt(dx * dx + dy * dy);
            if (distance > maxJoyRadius) { 
                dx = (dx / distance) * maxJoyRadius; 
                dy = (dy / distance) * maxJoyRadius; 
            }
            joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joyVector.x = dx / maxJoyRadius; 
            joyVector.y = dy / maxJoyRadius;
        }

        function takePlayerDamage(amount) {
            player.health -= amount;
            let hpPercent = Math.max(0, player.health);
            healthFill.style.width = `${hpPercent}%`;
            if(hpPercent < 50) healthFill.style.backgroundColor = "#f1c40f"; 
            if(hpPercent < 20) healthFill.style.backgroundColor = "#e74c3c"; 

            if (player.health <= 0) {
                isGameRunning = false;
                setTimeout(() => { alert("Game Over! Defeated by Chikipi."); location.reload(); }, 100);
            }
        }

        // --- PLAYER ACTIONS ---
        document.getElementById('btn-crawl').addEventListener('touchstart', doDash, {passive: false});
        document.getElementById('btn-crawl').addEventListener('mousedown', doDash);
        function doDash(e) {
            if(e) e.stopPropagation();
            if (player.isDashing) return;
            player.isDashing = true;
            playerEl.classList.add('dashing');
            setTimeout(() => { player.isDashing = false; playerEl.classList.remove('dashing'); }, 500);
        }

        document.getElementById('btn-shoot').addEventListener('touchstart', playerAttack, {passive: false});
        document.getElementById('btn-shoot').addEventListener('mousedown', playerAttack);
        
        function playerAttack(e) {
            if(e) e.stopPropagation();
            if (!isGameRunning) return;

            // Trigger Player Attack Animation
            playerSprite.src = 'player-attack.gif';
            if (playerAttackTimer) clearTimeout(playerAttackTimer);
            playerAttackTimer = setTimeout(() => {
                playerSprite.src = 'player-idle.gif'; // Revert to idle after 400ms
            }, 400);

            // Hit Trees (Must be touching)
            const TREE_ATTACK_RANGE = 50; 
            for (let i = trees.length - 1; i >= 0; i--) {
                let tree = trees[i];
                let dist = Math.sqrt(Math.pow(tree.x - player.x, 2) + Math.pow(tree.y - player.y, 2));
                if (dist < TREE_ATTACK_RANGE) {
                    tree.hits++;
                    tree.el.style.transform = 'translate(-50%, -100%) rotate(5deg)';
                    setTimeout(() => { if(tree.el) tree.el.style.transform = 'translate(-50%, -100%) rotate(0deg)'; }, 100);
                    if (tree.hits % 5 === 0) {
                        tree.woodGiven++;
                        showNotification("Wood x1");
                        if (tree.woodGiven >= 5) {
                            tree.el.remove();
                            trees.splice(i, 1);
                        }
                    }
                    return; 
                }
            }

            // Hit Chikipis (Stun Mechanic)
            const COMBAT_RANGE = 80;
            for (let i = chikipis.length - 1; i >= 0; i--) {
                let c = chikipis[i];
                let dx = c.x - player.x;
                let dy = c.y - player.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < COMBAT_RANGE) {
                    c.health -= 2;
                    c.isAggro = true; 
                    
                    c.stunTimer = Date.now() + 1000;
                    c.state = 'stun';
                    setChikipiAnim(c, 'Chikipi-damage.gif');

                    let pushAngle = Math.atan2(dy, dx);
                    c.x += Math.cos(pushAngle) * 20;
                    c.y += Math.sin(pushAngle) * 20;

                    if (c.health <= 0) {
                        c.el.remove();
                        chikipis.splice(i, 1);
                    }
                    return; 
                }
            }
        }

        // --- MAIN GAME LOOP ---
        function gameLoop() {
            if (!isGameRunning) return;
            let now = Date.now();

            if (now - lastCycleChange > CYCLE_TIME) {
                toggleTime(); 
            }

            // Update Player Facing Direction
            if (joyVector.x < 0) player.facing = -1;
            else if (joyVector.x > 0) player.facing = 1;
            playerSprite.style.transform = `scaleX(${player.facing})`;

            let currentSpeed = player.isDashing ? player.speed * 3 : player.speed;
            let nextX = player.x + joyVector.x * currentSpeed;
            let nextY = player.y + joyVector.y * currentSpeed;
            
            let canMoveX = true;
            let canMoveY = true;
            const COLLISION_RADIUS = 40; 
            
            trees.forEach(tree => {
                if (!tree.isVisible) return;
                let distX = Math.sqrt(Math.pow(tree.x - nextX, 2) + Math.pow(tree.y - player.y, 2));
                if (distX < COLLISION_RADIUS) canMoveX = false;
                
                let distY = Math.sqrt(Math.pow(tree.x - player.x, 2) + Math.pow(tree.y - nextY, 2));
                if (distY < COLLISION_RADIUS) canMoveY = false;
            });

            if (canMoveX) player.x = nextX;
            if (canMoveY) player.y = nextY;
            
            player.x = Math.max(20, Math.min(WORLD_SIZE - 20, player.x));
            player.y = Math.max(40, Math.min(WORLD_SIZE - 40, player.y));
            playerEl.style.left = `${player.x}px`;
            playerEl.style.top = `${player.y}px`;

            let pChunkX = Math.floor(player.x / CHUNK_SIZE);
            let pChunkY = Math.floor(player.y / CHUNK_SIZE);
            
            if (pChunkX !== currentChunkX || pChunkY !== currentChunkY) {
                currentChunkX = pChunkX;
                currentChunkY = pChunkY;
                
                [grasses, trees, stones].forEach(arr => {
                    arr.forEach(entity => {
                        let cX = Math.floor(entity.x / CHUNK_SIZE);
                        let cY = Math.floor(entity.y / CHUNK_SIZE);
                        let isVisible = Math.abs(cX - currentChunkX) <= 1 && Math.abs(cY - currentChunkY) <= 1;
                        if (entity.isVisible !== isVisible) {
                            entity.isVisible = isVisible;
                            entity.el.style.display = isVisible ? 'block' : 'none';
                        }
                    });
                });
            }

            chikipis.forEach(c => {
                let cChunkX = Math.floor(c.x / CHUNK_SIZE);
                let cChunkY = Math.floor(c.y / CHUNK_SIZE);
                let isVisible = Math.abs(cChunkX - currentChunkX) <= 1 && Math.abs(cChunkY - currentChunkY) <= 1;
                
                if (c.isVisible !== isVisible) {
                    c.isVisible = isVisible;
                    c.el.style.display = isVisible ? 'block' : 'none';
                }

                if (!isVisible && !c.isAggro) return;

                let pDx = player.x - c.x;
                let pDy = player.y - c.y;
                let distToPlayer = Math.sqrt(pDx * pDx + pDy * pDy);

                if (c.state === 'stun') {
                    if (now > c.stunTimer) {
                        c.state = 'chase';
                        setChikipiAnim(c, 'chikipi.gif');
                    }
                }
                else if (c.state === 'dash') {
                    c.x += c.dashVx;
                    c.y += c.dashVy;
                    
                    if (distToPlayer < 30) { 
                        takePlayerDamage(10); 
                        c.state = 'melee';    
                        setChikipiAnim(c, 'Chicken-mele.gif');
                        c.nextDashTime = now + 3000; 
                    }

                    if (now > c.dashTimer) { 
                        c.state = 'chase';
                        setChikipiAnim(c, 'chikipi.gif');
                        c.nextDashTime = now + 3000;
                    }
                } 
                else if (c.isAggro) {
                    if (distToPlayer <= 70) {
                        c.state = 'melee';
                        setChikipiAnim(c, 'Chicken-mele.gif');
                        
                        if (distToPlayer > 30) {
                            let angle = Math.atan2(pDy, pDx);
                            c.x += Math.cos(angle) * 1.5;
                            c.y += Math.sin(angle) * 1.5;
                            c.img.style.transform = Math.cos(angle) < 0 ? 'scaleX(-1)' : 'scaleX(1)';
                        }

                        if (now > c.nextMeleeAttack) {
                            takePlayerDamage(5); 
                            c.nextMeleeAttack = now + 1000; 
                        }
                    } 
                    else if (distToPlayer <= 150 && now > c.nextDashTime) {
                        c.state = 'dash';
                        c.currentAnim = 'dash'; 
                        c.img.src = 'Chicken_dash.gif?t=' + now; 
                        
                        let angle = Math.atan2(pDy, pDx);
                        let dashSpeed = 12;
                        c.dashVx = Math.cos(angle) * dashSpeed;
                        c.dashVy = Math.sin(angle) * dashSpeed;
                        c.dashTimer = now + 800; 
                        c.img.style.transform = c.dashVx < 0 ? 'scaleX(-1)' : 'scaleX(1)';
                    } 
                    else {
                        c.state = 'chase';
                        setChikipiAnim(c, 'chikipi.gif');
                        let angle = Math.atan2(pDy, pDx);
                        let chaseSpeed = 3.5; 
                        c.x += Math.cos(angle) * chaseSpeed;
                        c.y += Math.sin(angle) * chaseSpeed;
                        c.img.style.transform = Math.cos(angle) < 0 ? 'scaleX(-1)' : 'scaleX(1)';
                    }
                } 
                else {
                    if (isNight) {
                        c.state = 'sleep';
                        setChikipiAnim(c, 'Chicken-sleep.gif');
                    } else {
                        // WANDER OR IDLE
                        if (c.state === 'idle') {
                            setChikipiAnim(c, 'chikipi-idle.gif');
                            if (now > c.nextWanderTime) {
                                c.state = 'wander';
                                c.targetX = Math.max(50, Math.min(WORLD_SIZE - 50, c.x + (Math.random() * 400 - 200)));
                                c.targetY = Math.max(50, Math.min(WORLD_SIZE - 50, c.y + (Math.random() * 400 - 200)));
                                c.nextWanderTime = now + 2000 + Math.random() * 3000; // time to spend wandering
                            }
                        } else {
                            setChikipiAnim(c, 'chikipi.gif');
                            let dist = Math.sqrt(Math.pow(c.targetX - c.x, 2) + Math.pow(c.targetY - c.y, 2));
                            
                            if (dist > 5 && now < c.nextWanderTime) {
                                let vx = ((c.targetX - c.x) / dist) * c.speed;
                                let vy = ((c.targetY - c.y) / dist) * c.speed;
                                c.x += vx; c.y += vy;
                                if (vx < 0) c.img.style.transform = 'scaleX(-1)'; 
                                else if (vx > 0) c.img.style.transform = 'scaleX(1)'; 
                            } else {
                                // Reached destination or timer expired, go back to idle
                                c.state = 'idle';
                                c.nextWanderTime = now + 1500 + Math.random() * 2000; // Idle for 1.5 - 3.5 seconds
                            }
                        }
                    }
                }
                c.el.style.left = `${c.x}px`;
                c.el.style.top = `${c.y}px`;
            });

            let cameraX = player.x - window.innerWidth / 2;
            let cameraY = player.y - window.innerHeight / 2;
            cameraX = Math.max(0, Math.min(WORLD_SIZE - window.innerWidth, cameraX));
            cameraY = Math.max(0, Math.min(WORLD_SIZE - window.innerHeight, cameraY));
            world.style.transform = `translate(${-cameraX}px, ${-cameraY}px)`;

            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);

    </script>
</body>
